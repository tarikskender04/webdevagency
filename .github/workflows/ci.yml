name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run verify
      - name: Validate production SEO output
        run: npm run build && npm run verify:seo
        env:
          PUBLIC_SITE_URL: https://meridian-ci.invalid
          PUBLIC_SITE_INDEXABLE: 'true'

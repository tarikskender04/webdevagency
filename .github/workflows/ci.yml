name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser checks with enquiry delivery on
        run: npm run build && npx playwright test tests/enquiry.spec.ts tests/site.spec.ts
        env:
          PUBLIC_ENQUIRY_ENABLED: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Validate production SEO output
        run: npm run build && npm run verify:seo
        env:
          PUBLIC_SITE_URL: https://prodigy-stdio-ci.invalid
          PUBLIC_SITE_INDEXABLE: 'true'
